backend:
  name: github
  repo: simonkral1/solbien-website
  branch: main

# For local development, use test-repo backend
# backend:
#   name: test-repo

media_folder: public/images
public_folder: /images

# Publish mode - editorial workflow for draft/review/publish
publish_mode: editorial_workflow

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home Page"
        file: "content/pages/home.json"
        fields:
          - { label: "Hero Title (EN)", name: "heroTitleEn", widget: "string" }
          - { label: "Hero Title (CZ)", name: "heroTitleCz", widget: "string" }
          - { label: "Hero Subtitle (EN)", name: "heroSubtitleEn", widget: "text" }
          - { label: "Hero Subtitle (CZ)", name: "heroSubtitleCz", widget: "text" }
          - { label: "Stats - Years", name: "statsYears", widget: "number" }
          - { label: "Stats - Projects", name: "statsProjects", widget: "number" }
          - { label: "Stats - Countries", name: "statsCountries", widget: "number" }

      - name: "about"
        label: "About Page"
        file: "content/pages/about.json"
        fields:
          - { label: "Title (EN)", name: "titleEn", widget: "string" }
          - { label: "Title (CZ)", name: "titleCz", widget: "string" }
          - { label: "Content (EN)", name: "contentEn", widget: "markdown" }
          - { label: "Content (CZ)", name: "contentCz", widget: "markdown" }

      - name: "contact"
        label: "Contact Page"
        file: "content/pages/contact.json"
        fields:
          - { label: "Address", name: "address", widget: "text" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Contact Person", name: "contactPerson", widget: "string" }
          - { label: "Contact Title (EN)", name: "contactTitleEn", widget: "string" }
          - { label: "Contact Title (CZ)", name: "contactTitleCz", widget: "string" }

  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Product Name", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Description (EN)", name: "descriptionEn", widget: "markdown" }
      - { label: "Description (CZ)", name: "descriptionCz", widget: "markdown" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Order", name: "order", widget: "number", default: 0 }

  - name: "team"
    label: "Team Members"
    folder: "content/team"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Title (EN)", name: "titleEn", widget: "string" }
      - { label: "Title (CZ)", name: "titleCz", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Bio (EN)", name: "bioEn", widget: "text", required: false }
      - { label: "Bio (CZ)", name: "bioCz", widget: "text", required: false }
      - { label: "Order", name: "order", widget: "number", default: 0 }

  - name: "solutions"
    label: "Solutions"
    folder: "content/solutions"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Solution Name (EN)", name: "titleEn", widget: "string" }
      - { label: "Solution Name (CZ)", name: "titleCz", widget: "string" }
      - { label: "Description (EN)", name: "descriptionEn", widget: "markdown" }
      - { label: "Description (CZ)", name: "descriptionCz", widget: "markdown" }
      - { label: "Icon", name: "icon", widget: "string", hint: "Lucide icon name (e.g., 'leaf', 'factory')" }
      - { label: "Order", name: "order", widget: "number", default: 0 }

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "general"
        label: "General Settings"
        file: "content/settings/general.json"
        fields:
          - { label: "Site Title", name: "siteTitle", widget: "string" }
          - { label: "Site Description (EN)", name: "siteDescriptionEn", widget: "text" }
          - { label: "Site Description (CZ)", name: "siteDescriptionCz", widget: "text" }
          - { label: "Logo", name: "logo", widget: "image" }
          - { label: "Footer Text (EN)", name: "footerTextEn", widget: "string" }
          - { label: "Footer Text (CZ)", name: "footerTextCz", widget: "string" }
