name: Mirror existing public images for Cloudflare migration

on:
  push:
    branches:
      - migration/cloudflare-pages
    paths:
      - '.github/workflows/mirror-images.yml'
      - 'scripts/mirror_existing_images.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Verify migration branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "migration/cloudflare-pages"

      - name: Download and verify the six public images
        run: python3 scripts/mirror_existing_images.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate static export with mirrored files
        run: |
          set -euo pipefail
          pnpm build
          test -s out/index.html
          test -s out/products/ewa.html
          test -s out/products/biocon.html
          test -s out/products/bios.html
          test -s out/products/bewabox.html
          for filename in home-meadow.jpeg biocon-product.png ewa-product.png bios-product.jpeg bewabox-product.png biocon-solutions.jpeg; do
            test -s "out/images/migrated/$filename"
          done

      - name: Commit verified copies only to migration branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "migration/cloudflare-pages"
          git config user.name 'solbien-migration-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/solutions/page.tsx app/products public/images/migrated
          if git diff --cached --quiet; then
            echo 'All assets already mirrored; no changes.'
            exit 0
          fi
          git commit -m 'Mirror six existing SOLBIEN images for independent static hosting'
          git push origin "HEAD:refs/heads/migration/cloudflare-pages"
