name: Cloudflare static export preflight

on:
  push:
    branches:
      - migration/cloudflare-pages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-static-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Validate expected static pages
        shell: bash
        run: |
          set -euo pipefail
          test -s out/index.html
          for route in about contacts solutions products products/ewa products/biocon products/bios products/bewabox; do
            test -s "out/${route}.html" || { echo "Missing exported route: ${route}"; exit 1; }
          done
          echo "All expected HTML routes exported successfully."

      - name: Validate zero broken local paths in HTML
        shell: bash
        run: |
          set -euo pipefail
          test -s out/404.html

      - name: Preserve nonproduction build as test artifact
        uses: actions/upload-artifact@v4
        with:
          name: solbien-cloudflare-static-export
          path: out/
          retention-days: 7
