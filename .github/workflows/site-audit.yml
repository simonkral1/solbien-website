name: Read-only SOLBIEN whole-site visual and content audit

on:
  push:
    branches: [audit/full-site-2026-11-26]
    paths:
      - '.github/workflows/site-audit.yml'
      - 'scripts/site-audit.cjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  site-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout audit-only branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install browser audit dependencies outside repository
        run: |
          set -euo pipefail
          mkdir -p /tmp/solbien-audit
          npm install --prefix /tmp/solbien-audit --no-audit --no-fund playwright@1.57.0
          if command -v google-chrome >/dev/null 2>&1; then
            echo "AUDIT_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            echo "AUDIT_CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
            chromium --version
          else
            PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64 /tmp/solbien-audit/node_modules/.bin/playwright install --with-deps chromium
            echo "PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64" >> "$GITHUB_ENV"
          fi
      - name: Audit all public pages at desktop and mobile widths
        env:
          NODE_PATH: /tmp/solbien-audit/node_modules
        run: node scripts/site-audit.cjs
      - name: Generate screenshot contact sheets
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          p=Path("audit-results/2026-11-26")
          routes=["home","about","contacts","solutions","products","products-ewa","products-biocon","products-bios","products-bewabox"]
          for mode,cell in [("desktop",(440,290)),("mobile",(240,470))]:
              w,h=cell
              canvas=Image.new("RGB",(w*3+40,h*3+60),(246,249,248))
              dr=ImageDraw.Draw(canvas)
              for i,route in enumerate(routes):
                  src=p/(route+"-"+mode+".jpg")
                  if not src.exists():continue
                  im=Image.open(src).convert("RGB")
                  vp=900 if mode=="desktop" else 844
                  im=im.crop((0,0,im.width,min(im.height,vp)))
                  im.thumbnail((w-12,h-40))
                  x=16+(i%3)*w+(w-12-im.width)//2
                  y=10+(i//3)*h
                  canvas.paste(im,(x,y+28))
                  dr.text((16+(i%3)*w,y+7),route,fill=(20,40,31))
              canvas.save(p/("CONTACT-"+mode+".jpg"),quality=84,optimize=True)
          PY
      - name: Persist audit output only on audit branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "audit/full-site-2026-11-26"
          git config user.name "solbien-audit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-results/2026-11-26
          if git diff --cached --quiet; then
            echo 'No new audit artifacts'
          else
            git commit -m 'Save read-only desktop/mobile public-site audit'
            git push origin "HEAD:refs/heads/audit/full-site-2026-11-26"
          fi
      - name: Preserve audit files as CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solbien-audit-2026-11-26
          path: audit-results/2026-11-26
          retention-days: 20
